# relay.cfg — единый конфиг для всех трёх частей (релей, Mac-агент, контроллер)
# Формат: INI. Комментарии — # или ;. Кодировка UTF-8.
#
# Кто что читает:
#   Relay.java    — секцию [relay]
#   mac_agent.py  — [relay] + [client] + [ui]
#   controller.py — [relay] + [client] + [ui]
#
# Путь к файлу: переменная окружения RELAY_CFG, иначе ./relay.cfg, иначе ~/.relay.cfg

[relay]
# Порт, который слушает Java-релей на VPS
bind_port = 8765
# Общий токен. Пусто = без проверки. Один и тот же на всех трёх сторонах.
token =

[client]
# Адрес релея для агента и контроллера (публичный IP VPS)
host = 127.0.0.1
# Порт релея для подключения
port = 8765
# Код комнаты = пароль сессии. Должен совпадать у Mac и помощника.
# Оставь пустым — Mac-агент сгенерирует код сам и впишет сюда.
room = 

[ui]
# yes — открыть окно Tk, no — работать прямо в текущем терминале (как ssh)
gui = yes
# Размер удалённого терминала
cols = 100
rows = 30

[agent]
# Шелл, который запускается на Mac. Пусто = $SHELL, иначе zsh, потом bash.
shell =
