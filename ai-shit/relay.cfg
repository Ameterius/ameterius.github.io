# relay.cfg — единый конфиг для всех трёх частей (релей, Mac-агент, контроллер)
# Формат: INI. Комментарии — # или ;. Кодировка UTF-8.
#
# Кто что читает:
#   Relay.java    — [relay]
#   mac_agent.py  — [client] [ui] [agent] [net] [relay]
#   controller.py — [client] [ui] [net] [relay]
#
# Путь к файлу: RELAY_CFG (у Python) / -Drelay.cfg= (у релея), иначе ./relay.cfg

[relay]
# Порт, который слушает Java-релей на VPS
bind_port = 8765
# Общий токен. Пусто = без проверки. Один и тот же на всех трёх сторонах.
token =

# --- режим "по требованию" -------------------------------------------------
# Как часто релей перепроверяет: нужен ли сейчас коннект (секунды).
refresh_every = 60
# На сколько клиенты уходят в КД, если коннект не нужен (секунды).
cooldown = 300
# Сколько живёт ответ "хочу коннект", прежде чем перепроверка не переспросит.
demand_ttl = 600
# Если коннект нужен, но никого нет — сколько ждать перед КД.
offline_grace = 60
# Файл команд для релея (можно оставить пустым):
#   cmd = cooldown
#   seconds = 300
#   room = 123456
command_file =

[client]
# Адрес релея для агента и контроллера (публичный IP VPS)
host = 127.0.0.1
# Порт релея для подключения
port = 8765
# Код комнаты = пароль сессии. Должен совпадать у Mac и помощника.
# Оставь пустым — Mac-агент сгенерирует код сам и впишет сюда.
room =

[net]
# Авто-коннект без ручных кнопок: клиенты сами подключаются и переподключаются.
auto_connect = yes
# Первая пауза перед переподключением, сек (1 = почти сразу).
retry_delay = 1
# Потолок паузы, сек.
retry_max = 5
# Пинг, чтобы NAT/файрвол не рвал простаивающий TCP.
ping_every = 15
# Сколько секунд тишины считать мёртвым каналом.
dead_after = 70
# Таймаут только на установку соединения.
connect_timeout = 10

[ui]
# yes — окно Tk, no — работать прямо в текущем терминале (как ssh)
gui = false
# Размер удалённого терминала
cols = 100
rows = 30

[agent]
# Шелл, который запускается на Mac. Пусто = $SHELL, иначе zsh, потом bash.
shell =
# Если сессия закончилась и помощник отключился — уйти в КД на столько секунд.
# 0 = не уходить, оставаться на связи.
idle_cooldown = 900
